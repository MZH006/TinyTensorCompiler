name: Linux CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make
          clang++ --version

      - name: Build
        run: make -j2

      - name: Correctness tests
        run: make test

      - name: UndefinedBehaviorSanitizer tests
        run: make test-ubsan

      - name: AddressSanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: make test-asan

      - name: Run example
        run: make run
